<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory Cycle Count</title>
    <!-- Tailwind CSS for Mobile-First Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html5Qrcode for robust mobile camera scanning (QR & Barcode) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- SweetAlert2 for beautiful non-blocking popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
            touch-action: pan-y; /* Prevent horizontal scroll, allow vertical */
        }
        /* Style for the scanner container to ensure it fits well on mobile */
        #reader {
            width: 100%;
            max-width: 420px;
            min-height: 420px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        #reader video {
            width: 100% !important;
            height: auto !important;
            object-fit: cover !important;
        }
        
        /* Custom SweetAlert styles for mobile */
        .swal2-popup {
            font-family: 'Prompt', sans-serif !important;
            border-radius: 1rem !important;
        }

        /* ==========================================
           ANDROID INPUT FIX
           ========================================== */
        #view-input {
            position: relative;
            min-height: 0;
        }

        /* ป้องกันหน้าโดนดัน/เลื่อนแปลก ๆ ตอน Keyboard เปิด */
        #actual-qty {
            position: relative;
            z-index: 5;
            -webkit-user-select: text;
            user-select: text;
        }

        /* ให้ปุ่มอยู่เหนือ element อื่น */
        #btn-submit {
            position: relative;
            z-index: 10;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center">

    <div class="w-full max-w-md bg-white shadow-sm flex flex-col items-center py-4 px-4 sticky top-0 z-10">
        <img src="https://www.alliedmfg.co.th/wp-content/uploads/2026/07/AMS-LOGO-V1.png" alt="AMS Logo" class="h-10 object-contain mb-1">
        <h1 class="text-lg font-semibold text-blue-900 tracking-wide">Inventory Cycle Count</h1>
    </div>

    <!-- Main Application Container -->
    <main class="w-full max-w-md flex-1 bg-white shadow-md flex flex-col relative overflow-hidden">
        <!-- AMS WATERMARK -->
        <div class="absolute inset-0 pointer-events-none z-0" style="background-image: url('https://www.alliedmfg.co.th/wp-content/uploads/2026/07/AMS-LOGO-V1.png'); background-repeat: no-repeat; background-position: center; background-size: 320px; opacity: 0.035;"></div>

        <!-- VIEW 1: SETUP / LOGIN -->
        <div id="view-setup" class="p-6 flex flex-col space-y-5 flex-1 relative z-10">
            <h2 class="text-xl font-medium text-gray-700 border-b pb-2">ข้อมูลผู้ตรวจนับ</h2>
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">โซนตรวจนับ (Zone)</label>
                <select id="zone-select" onchange="updateLocations()" class="w-full border border-gray-300 rounded-lg p-3 text-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    <option value="" disabled selected>-- เลือกโซนตรวจนับ --</option>
                    <option value="ZONE_A">Zone A</option>
                    <option value="ZONE_B">Zone B</option>
                    <option value="ZONE_C">Zone C</option>
                    <option value="ZONE_D">Zone D</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">พื้นที่ปฏิบัติงาน (Location)</label>
                <select id="location-select" class="w-full border border-gray-300 rounded-lg p-3 text-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" disabled>
                    <option value="" disabled selected>-- กรุณาเลือกโซนก่อน --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อผู้รับผิดชอบ (Responsible Person)</label>
                <input type="text" id="responsible-name" placeholder="ระบุชื่อผู้ตรวจ" enterkeyhint="done" onkeydown="if(event.key === 'Enter') { event.preventDefault(); goToScanner(); }" class="w-full border border-gray-300 rounded-lg p-3 text-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <div class="flex-1"></div> <!-- Spacer -->

            <button onclick="goToScanner()" class="w-full bg-blue-600 text-white font-semibold rounded-xl p-4 text-xl shadow-lg active:bg-blue-700 transition-colors flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                เริ่มเปิดกล้องสแกน
            </button>
        </div>

        <!-- VIEW 2: SCANNER -->
        <div id="view-scanner" class="hidden p-4 flex flex-col flex-1 h-full bg-gray-900 relative z-10">
            <div class="text-center mb-4">
                <h2 class="text-white text-lg font-semibold tracking-wider">SCAN QR CODE / BARCODE</h2>
                <p class="text-gray-400 text-sm">นำบาร์โค้ดมาให้อยู่ในกรอบเพื่อสแกน</p>
            </div>

            <div class="flex-1 flex flex-col justify-center items-center w-full relative">
                <div id="reader"></div>
                
                <!-- Error Overlay (Hidden by default) -->
                <div id="camera-error" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center p-6 text-center z-20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <p class="text-white mb-4" id="camera-error-msg">ไม่สามารถเปิดกล้องได้<br>กรุณาอนุญาตการใช้งานกล้อง</p>
                    <button onclick="initScanner()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium shadow active:bg-blue-700">ลองเปิดกล้องอีกครั้ง</button>
                </div>
            </div>

            <div class="mt-6 mb-4 flex justify-between gap-4">
                <button onclick="stopScannerAndGoBack()" class="flex-1 bg-gray-700 text-white font-medium rounded-lg p-3 active:bg-gray-600 transition-colors">
                    ย้อนกลับ
                </button>
                <button onclick="switchCamera()" id="btn-switch-cam" class="flex-1 bg-gray-700 text-white font-medium rounded-lg p-3 active:bg-gray-600 transition-colors flex justify-center items-center gap-2 hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    สลับกล้อง
                </button>
            </div>
        </div>

        <!-- VIEW 3: INPUT COUNT -->
        <div id="view-input" class="hidden p-6 flex flex-col flex-1 h-full relative z-10">
            
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-5 mb-6 text-center shadow-sm">
                <p class="text-sm text-blue-600 font-medium mb-1">LOT NUMBER</p>
                <h2 id="display-lot" class="text-3xl font-bold text-gray-900 break-all">WO-000000</h2>
                <p class="text-xs text-gray-500 mt-2">Part: <span id="display-part"></span></p>
                <!-- UNIT FROM PART MASTER - RC ONLY -->
                <div id="rc-unit-display" class="hidden mt-3">
                    <p class="text-sm text-blue-600 font-medium">UNIT</p>
                    <p id="display-unit" class="text-2xl font-bold text-gray-900">-</p>
                </div>
            </div>

            <!-- UNIT2 - RC ONLY -->
            <div id="unit2-container" class="hidden mb-6">
                <label class="block text-center text-lg font-semibold text-gray-700 mb-3">Unit2</label>
                <select id="unit2-select" class="w-full border-2 border-blue-300 rounded-xl p-4 text-lg bg-white focus:ring-4 focus:ring-blue-200 focus:border-blue-500 outline-none">
                    <option value="" selected>-- กรุณาเลือก Unit2 --</option>
                    <option value="M">M</option>
                    <option value="MM">MM</option>
                    <option value="RL">RL</option>
                    <option value="SHT">SHT</option>
                    <option value="BLK">BLK</option>
                    <option value="PCS">PCS</option>
                    <option value="LTR">LTR</option>
                    <option value="KG">KG</option>
                    <option value="SET">SET</option>
                </select>
            </div>

            <div class="mb-8">
                <label class="block text-center text-lg font-semibold text-gray-700 mb-3">จำนวนที่ตรวจนับได้จริง</label>
                <input type="number" id="actual-qty" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" onkeydown="if(event.key === 'Enter') { event.preventDefault(); submitCount(); }" class="w-full border-2 border-blue-300 rounded-xl p-4 text-center text-4xl font-bold text-gray-800 bg-white focus:ring-4 focus:ring-blue-200 focus:border-blue-500 outline-none transition-all shadow-inner" placeholder="0">
            </div>
            
            <div class="flex-1"></div>

            <div class="flex gap-4">
                 <button onclick="cancelInput()" class="w-1/3 bg-gray-200 text-gray-700 font-semibold rounded-xl p-4 text-lg active:bg-gray-300 transition-colors">
                    ยกเลิก
                </button>
                <button type="button" onclick="submitCount()" id="btn-submit" class="w-2/3 bg-green-600 text-white font-semibold rounded-xl p-4 text-xl shadow-lg active:bg-green-700 transition-colors flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    บันทึกข้อมูล
                </button>
            </div>
        </div>

        <!-- LOADING OVERLAY -->
        <div id="loading-overlay" class="hidden absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-14 w-14 border-b-4 border-blue-600 mb-4"></div>
            <p class="text-blue-800 font-medium text-lg animate-pulse">กำลังบันทึกข้อมูล...</p>
        </div>
    </main>

    <script>
        // กำหนด URL ของ Google Apps Script ของคุณที่นี่ (สำคัญมาก: ตรวจสอบให้แน่ใจว่าเป็น Web App URL ที่อัปเดตแล้ว)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzXgFiJWsDft8DL7MZia3hlM3pBC0_rVYHhKL-dA2-fX1sCpwNki7NoD2lRbnfxUDriSg/exec';

        // --- State Management ---
        const MOCK_ZONES = {
            "ZONE_A": ["A1-1", "A1-2", "A1-3"],
            "ZONE_B": ["B1-1", "B1-2", "B1-3"],
            "ZONE_C": ["C1-1", "C1-2", "C1-3"],
            "ZONE_D": ["D1-1", "D1-2", "D1-3", "D1-4"]
        };

        let currentSession = {
            zone: "",
            location: "",
            responsiblePerson: ""
        };

        let currentScanData = {
            partNumber: "",
            qrQty: "",
            unit: "",
            lotNumber: "",
            serialNumber: "",
            unit2: ""
        };
        let html5QrCode = null;
        let availableCameras = [];
        let currentCameraIndex = 0;

        // --- View Navigation ---
        function showView(viewId) {
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-scanner').classList.add('hidden');
            document.getElementById('view-input').classList.add('hidden');
            
            document.getElementById(viewId).classList.remove('hidden');
            document.getElementById(viewId).classList.add('flex');
        }

        function cancelInput() {
            showView('view-scanner');
            initScanner();
        }

        function updateLocations() {
            const zone = document.getElementById('zone-select').value;
            const locSelect = document.getElementById('location-select');
            locSelect.innerHTML = '<option value="" disabled selected>-- เลือกพื้นที่ --</option>';

            if (MOCK_ZONES[zone]) {
                MOCK_ZONES[zone].forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc;
                    opt.textContent = loc;
                    locSelect.appendChild(opt);
                });
                locSelect.disabled = false;
            } else {
                locSelect.disabled = true;
            }
        }

        // --- STREAMING_CHUNK:Scanner Logic via Html5Qrcode ---
        function goToScanner() {
            const zone = document.getElementById('zone-select').value;
            const loc = document.getElementById('location-select').value;
            const resp = document.getElementById('responsible-name').value.trim();

            if (!zone || !loc || !resp) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ข้อมูลไม่ครบถ้วน',
                    text: 'กรุณากรอกข้อมูลผู้ตรวจนับให้ครบถ้วนก่อนเริ่มสแกน',
                    confirmButtonColor: '#3085d6'
                });
                return;
            }

            currentSession.zone = zone;
            currentSession.location = loc;
            currentSession.responsiblePerson = resp;

            showView('view-scanner');
            initScanner();
        }

        function initScanner() {
            const reader = document.getElementById("reader");
            const errorBox = document.getElementById("camera-error");
            errorBox.classList.add("hidden");
            reader.innerHTML = "";

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const cameraConfig = {
    facingMode: "environment"
};

const config = {
    fps: 10,

    qrbox: {
        width: 340,
        height: 220
    },

    aspectRatio: 1.0,

    useBarCodeDetectorIfSupported: true,

    videoConstraints: {
        facingMode: {
            ideal: "environment"
        },
        width: {
            ideal: 1920
        },
        height: {
            ideal: 1080
        }
    }
};

            html5QrCode.start(
                cameraConfig,
                config,
                function(decodedText) {
                    console.log("SCAN:", decodedText);
                    html5QrCode.stop()
                        .then(() => { html5QrCode.clear(); processScannedData(decodedText); })
                        .catch(() => { processScannedData(decodedText); });
                },
                function(errorMessage) {
                    // ไม่ต้องทำอะไร
                }
            }).then(() => {
    console.log("CAMERA OK");

    try {
        const track = html5QrCode.getRunningTrack();

        if (!track) {
            console.log("ไม่พบ Camera Track");
            return;
        }

        const capabilities = track.getCapabilities();
        const settings = track.getSettings();

        console.log("Camera capabilities:", capabilities);
        console.log("Camera settings:", settings);

        // ==========================================
        // 1. AUTO FOCUS
        // ==========================================
        if (capabilities.focusMode) {

            console.log(
                "Focus modes:",
                capabilities.focusMode
            );

            // ให้กล้องโฟกัสต่อเนื่องเหมือนกล้องมือถือ
            if (capabilities.focusMode.includes("continuous")) {

                track.applyConstraints({
                    advanced: [
                        {
                            focusMode: "continuous"
                        }
                    ]
                }).then(() => {

                    console.log("AUTO FOCUS: CONTINUOUS ON");

                }).catch(error => {

                    console.log(
                        "Continuous focus ไม่รองรับ:",
                        error
                    );

                });

            }

            // ถ้าไม่มี continuous
            else if (capabilities.focusMode.includes("single-shot")) {

                track.applyConstraints({
                    advanced: [
                        {
                            focusMode: "single-shot"
                        }
                    ]
                }).then(() => {

                    console.log("AUTO FOCUS: SINGLE SHOT");

                }).catch(error => {

                    console.log(
                        "Single-shot focus ไม่รองรับ:",
                        error
                    );

                });
            }
        }

        // ==========================================
        // 2. AUTO ZOOM
        // ==========================================
        if (
            capabilities.zoom &&
            capabilities.zoom.max &&
            capabilities.zoom.max > 1
        ) {

            const currentZoom = settings.zoom || 1;

            // ไม่ซูมแรงเกินไป
            const targetZoom = Math.min(
                1.5,
                capabilities.zoom.max
            );

            if (targetZoom > currentZoom) {

                track.applyConstraints({
                    advanced: [
                        {
                            zoom: targetZoom
                        }
                    ]
                }).then(() => {

                    console.log(
                        "AUTO ZOOM:",
                        targetZoom
                    );

                }).catch(error => {

                    console.log(
                        "Zoom ไม่รองรับ:",
                        error
                    );

                });
            }
        }

        // ==========================================
        // 3. แตะหน้าจอ = กระตุ้น Auto Focus ใหม่
        // ==========================================
        setTimeout(() => {

            const videoElem =
                document.querySelector("#reader video");

            if (!videoElem) {
                console.log("ไม่พบ video element");
                return;
            }

            videoElem.addEventListener("click", () => {

                console.log("USER TAP → REFRESH FOCUS");

                if (
                    capabilities.focusMode &&
                    capabilities.focusMode.includes("continuous")
                ) {

                    track.applyConstraints({
                        advanced: [
                            {
                                focusMode: "continuous"
                            }
                        ]
                    }).then(() => {

                        console.log(
                            "FOCUS REFRESHED"
                        );

                    }).catch(error => {

                        console.log(
                            "Focus refresh error:",
                            error
                        );

                    });

                }

            });

        }, 800);

    } catch (err) {

        console.log(
            "Camera advanced features not supported:",
            err
        );

    }

}).catch((error) => {
                console.error("CAMERA ERROR:", error);
                errorBox.classList.remove("hidden");
                
                let errorMsg = "เปิดกล้องไม่ได้<br><br>กรุณากดอนุญาตการใช้งานกล้อง<br>แล้วลองใหม่อีกครั้ง";
                let errStr = error.toString().toLowerCase();
                
                if (errStr.includes("notallowederror") || errStr.includes("permission dismissed") || errStr.includes("permission denied")) {
                    errorMsg = "คุณได้ปิดหรือปฏิเสธการขอสิทธิ์เข้าถึงกล้อง<br><br>กรุณา <b>รีเฟรชหน้าเว็บ (Refresh)</b> หรือไปที่การตั้งค่า Browser เพื่ออนุญาตการใช้งานกล้อง";
                } else if (errStr.includes("notfounderror")) {
                    errorMsg = "ไม่พบกล้องในอุปกรณ์นี้<br><br>โปรดตรวจสอบว่าอุปกรณ์ของคุณมีกล้องและใช้งานได้ปกติ";
                }

                document.getElementById("camera-error-msg").innerHTML = errorMsg;
            });
        }

        function switchCamera() {
            if (availableCameras.length > 1 && html5QrCode) {
                currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
                const newCameraId = availableCameras[currentCameraIndex].id;
                
                html5QrCode.stop().then(() => {
                    const config = { fps: 10, qrbox: { width: 340, height: 220 }, aspectRatio: 1.0 };
                    html5QrCode.start(newCameraId, config, function(decodedText) {
                        html5QrCode.stop().then(() => { html5QrCode.clear(); processScannedData(decodedText); });
                    }, function(err) {});
                });
            }
        }

        function stopScannerAndGoBack() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    showView('view-setup');
                }).catch(err => {
                    showView('view-setup');
                });
            } else {
                showView('view-setup');
            }
        }

        // --- STREAMING_CHUNK:Handling Scan Data and Parsing ---
        function processScannedData(text) {
            console.log("QR DATA:", text);

            const parts = text.split(',').map(x => x.trim());

            if (parts.length < 4) {
                Swal.fire({
                    icon: 'error',
                    title: 'รูปแบบไม่ถูกต้อง',
                    text: 'ข้อมูล QR / Barcode ไม่ถูกต้อง',
                    confirmButtonText: 'สแกนใหม่'
                }).then(() => { initScanner(); });
                return;
            }

            let lotNumber = "";
            let qrType = "";

            for (let i = 0; i < parts.length; i++) {
                const value = parts[i];
                if (/^WO2([-_]|$)/i.test(value)) {
                    lotNumber = value;
                    qrType = "WO2";
                    break;
                }
                if (/^WO([-_]|$)/i.test(value)) {
                    lotNumber = value;
                    qrType = "WO";
                    break;
                }
                if (/^RC([-_]|$)/i.test(value)) {
                    lotNumber = value;
                    qrType = "RC";
                    break;
                }
            }

            if (!lotNumber) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ไม่พบ WO / WO2 / RC',
                    text: 'ไม่พบหมายเลข WO, WO2 หรือ RC ใน QR Code นี้',
                    confirmButtonText: 'สแกนใหม่'
                }).then(() => { initScanner(); });
                return;
            }

            // RESET UNIT2 + RC UNIT
            currentScanData.unit2 = "";
            currentScanData.unit = "";
            document.getElementById('rc-unit-display').classList.add('hidden');
            document.getElementById('display-unit').textContent = "-";
            
            const unit2Container = document.getElementById('unit2-container');
            const unit2Select = document.getElementById('unit2-select');
            unit2Select.value = "";

            // COMMON
            currentScanData.partNumber = parts[0] || "";
            currentScanData.lotNumber = lotNumber;

            // WO / WO2
            if (qrType === "WO" || qrType === "WO2") {
                currentScanData.qrQty = parts[1] || "";
                currentScanData.unit = parts[2] || "";
                currentScanData.serialNumber = parts.length >= 5 ? parts[4] : "-";

                document.getElementById('rc-unit-display').classList.add('hidden');
                document.getElementById('display-unit').textContent = "-";
                unit2Container.classList.add('hidden');
            }
            
            // RC
            if (qrType === "RC") {
                currentScanData.qrQty = parts[4] || "";
                currentScanData.serialNumber = parts[parts.length - 1] || "-";
                currentScanData.unit = "";

                unit2Container.classList.remove('hidden');
                document.getElementById('rc-unit-display').classList.remove('hidden');
                document.getElementById('display-unit').textContent = "กำลังค้นหา...";

                getPartUnitFromMaster(currentScanData.partNumber).then(unit => {
                    currentScanData.unit = unit;
                    document.getElementById('display-unit').textContent = unit;
                    document.getElementById('rc-unit-display').classList.remove('hidden');
                }).catch(error => {
                    currentScanData.unit = "";
                    document.getElementById('display-unit').textContent = "-";
                    Swal.fire({
                        icon: 'error',
                        title: 'ไม่พบ Unit',
                        text: error.message,
                        confirmButtonText: 'สแกนใหม่'
                    }).then(() => { cancelInput(); });
                });
            }

            // UPDATE UI
            document.getElementById('display-lot').textContent = currentScanData.lotNumber;
            document.getElementById('display-part').textContent = currentScanData.partNumber;
            document.getElementById('actual-qty').value = "";

            showView('view-input');
        }

        // --- STREAMING_CHUNK:Get Part Unit From Google Apps Script ---
        function getPartUnitFromMaster(partNumber) {
            return fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: new URLSearchParams({
                    data: JSON.stringify({ action: 'getPartUnit', partNumber: partNumber })
                })
            })
            .then(response => response.json())
            .then(result => {
                if (result.status !== 'success') throw new Error(result.message || 'ไม่สามารถค้นหา Unit ได้');
                if (!result.unit) throw new Error('ไม่พบ Unit ของ Part Number: ' + partNumber + ' ใน Part_Master');
                return result.unit;
            });
        }

        // --- STREAMING_CHUNK:Submit Data to Google Apps Script ---
        function submitCount() {
            const input = document.getElementById('actual-qty');
            const actualQty = input.value.trim();
            input.blur();

            if (actualQty === "" || isNaN(actualQty) || Number(actualQty) < 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณาระบุจำนวน',
                    text: 'จำนวนที่ตรวจนับต้องเป็นตัวเลขที่มากกว่าหรือเท่ากับ 0',
                    confirmButtonColor: '#3085d6'
                });
                return;
            }

            if (currentScanData.lotNumber && /^RC([-_]|$)/i.test(currentScanData.lotNumber) && !currentScanData.unit2) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณาเลือก Unit2',
                    text: 'QR Code นี้เป็น RC กรุณาเลือกหน่วย Unit2 ก่อนบันทึก',
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: '#3085d6'
                });
                return;
            }

            const payload = {
                ...currentSession,
                ...currentScanData,
                actualQty: actualQty
            };

            document.getElementById('loading-overlay').classList.remove('hidden');

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: new URLSearchParams({ data: JSON.stringify(payload) })
            })
            .then(async response => {
                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (e) {
                    throw new Error('Google Apps Script ไม่ส่ง JSON กลับมา');
                }
                if (result.status !== 'success') {
                    throw new Error(result.message || 'บันทึกข้อมูลไม่สำเร็จ');
                }
                return result;
            })
            .then(result => {
                document.getElementById('loading-overlay').classList.add('hidden');
                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกสำเร็จ',
                    html: 'บันทึกข้อมูลลง Sheet <b>' + result.sheet + '</b> เรียบร้อยแล้ว',
                    timer: 1800,
                    showConfirmButton: false
                }).then(() => {
                    showView('view-scanner');
                    initScanner();
                });
            })
            .catch(error => {
                console.error('SAVE ERROR:', error);
                document.getElementById('loading-overlay').classList.add('hidden');
                Swal.fire({
                    icon: 'error',
                    title: 'บันทึกข้อมูลไม่สำเร็จ',
                    text: error.message || error.toString(),
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: '#d33'
                });
            });
        }

        // UNIT2 DROPDOWN
        document.getElementById('unit2-select').addEventListener('change', function () {
            currentScanData.unit2 = this.value;
        });

    </script>
</body>
</html>
